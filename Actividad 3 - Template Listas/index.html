<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comidas Argentinas</title> 
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Edu+QLD+Hand:wght@400..700&family=Inconsolata:wght@200..900&family=Playwrite+CA+Guides&display=swap" rel="stylesheet">
</head>
<body>
    <header>
      <!-- Para filtros y navegacion -->
    </header>

    <main class="comida-container" id="comidaContainer">
        <!-- Contenido Dinamico -->
    </main>     

    <section class="addFood">
      <!-- Para el form para agregar comida -->

      <form id="agregarComida">

        <label>Nombre de la comida:</label>
        <input type="text" placeholder="Nombre de la comida" name="nombre" required>

        <label>Categoría:</label>
        <input type="text" placeholder="Categoría" name="categoria">

        <label>Provincia:</label>
        <input type="text" placeholder="Provincia" name="provincia">

        <label>Ingredientes:</label>
        <input type="text" placeholder="Ingredientes" name="ingredientes">

        <button type="submit">Agregar comida</button>


      </form>




    </section>

    <script type="module" src="./main.js"></script>
</body>
</html>
